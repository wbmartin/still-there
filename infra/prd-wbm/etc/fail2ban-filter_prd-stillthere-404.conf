# /srv/prd-stillthere/etc/fail2ban-filter_prd-stillthere-404.conf, symlinked
# as /etc/fail2ban/filter.d/prd-stillthere-404.conf (doc/320, fail2ban).
# This app's own copy, so gsd-notes' nginx-404 filter is never edited.
#
# Matches a client walking 4xx responses in the nginx access log:
# 400/404/405/406 is scanning, 401/403 is auth probing.
#
# Ignored: the API (/api/ on stillthere.teamtaggle.com), which answers
# 400/401/403/404 to real users all day and rate-limits and locks out
# failed logins itself; and POST /telnyx-inbound on webhook.teamtaggle.com,
# where a 401 is a bad signature the API refuses and banning Telnyx's
# address would stop every inbound text.
[Definition]
failregex = ^<HOST> -.*"(GET|POST|HEAD).*HTTP.*" 40[0123456]
ignoreregex = "(GET|POST|HEAD) /api/
              "POST /telnyx-inbound
