# Port 80 only, for the FIRST certificates (doc/320, first install, step
# Certificates). The two real sites name certificate files that do not
# exist until certbot has issued them, so nginx -t refuses them before
# then. This file answers the HTTP-01 webroot challenge for both names
# meanwhile; it is enabled for the issue and removed right after, when the
# real sites (whose port-80 blocks serve the same webroot for renewals)
# take over. Not an nginx_* file: never left enabled.
server {
    listen 80;
    listen [::]:80;
    server_name stillthere.teamtaggle.com webhook.teamtaggle.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
