# /srv/prd-stillthere/etc/fail2ban-jail_prd-stillthere.conf, symlinked as
# /etc/fail2ban/jail.d/prd-stillthere.conf (doc/320, fail2ban).
#
# prd-wbm is shared: fail2ban itself, its jail.local, its [DEFAULT]
# (ignoreip among it) and the sshd jail belong to gsd-notes' repo. This
# file adds one jail, this app's, and overrides nothing host-wide. Its
# settings are spelled out here so it does not lean on another app's
# jail.local.
#
# One jail for both of this app's sites: a client walking 4xx on either is
# scanning. The filter (fail2ban-filter_prd-stillthere-404.conf) ignores
# /api/ and the Telnyx webhook, whose 4xx are the API answering real
# callers.
[prd-stillthere]
enabled   = true
port      = http,https
filter    = prd-stillthere-404
backend   = auto
banaction = ufw
findtime  = 60
maxretry  = 10
bantime   = 10m
logpath   = /var/log/nginx/prd-stillthere_access.log
            /var/log/nginx/prd-stillthere-webhook_access.log
