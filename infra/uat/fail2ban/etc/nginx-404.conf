# Mirror of /srv/fail2ban/etc/nginx-404.conf, symlinked from
# /etc/fail2ban/filter.d/nginx-404.conf. Matches a client walking 4xx
# responses in the nginx access log: 400/404/405/406 is scanning, 401/403
# is auth probing. Shared by every app jail on the host, so it stays
# generic; each app jail in jail.local sets ignoreregex to skip /api/.
[Definition]
failregex = ^<HOST> -.*"(GET|POST|HEAD).*HTTP.*" 40[0123456]
ignoreregex =
