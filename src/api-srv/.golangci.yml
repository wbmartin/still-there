run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - gofmt
    - goimports
    - govet
    - ineffassign
    - staticcheck
    - unused
    - revive
    - gosimple
    - goconst
    # lll: line length linter; increased to 120 to reduce errors; consider treating as warnings in CI if still too strict
    - lll

linters-settings:
  lll:
    line-length: 120
